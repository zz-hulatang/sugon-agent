<!doctype html>
<form id="login-form">
  <div id="credentials-panel">
    <input id="username" autocomplete="username">
    <input id="password" type="password" autocomplete="current-password">
    <input id="login-slider" type="range" min="0" max="100" value="0" disabled>
    <button id="submit" type="submit" hidden>登录</button>
  </div>
  <div id="sms-panel" hidden><input autocomplete="one-time-code"><button>验证并登录</button></div>
  <p id="login-error" hidden>登录未完成</p>
</form>
<script>
const mode = '__MODE__';
const slider = document.querySelector('#login-slider');
if (mode === 'button') {
  slider.hidden = true;
  document.querySelector('#submit').hidden = false;
}
setTimeout(() => { slider.disabled = false; }, 500);
let busy = false;
async function submitLogin() {
  if (busy) return;
  busy = true;
  const response = await fetch('/test-auth', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: document.querySelector('#username').value,
                          password: document.querySelector('#password').value})
  });
  const result = await response.json();
  if (result.mode === 'failure') {
    document.querySelector('#login-error').hidden = false;
    busy = false;
    slider.value = 0;
    return;
  }
  if (result.mode === 'mfa') {
    document.querySelector('#credentials-panel').hidden = true;
    document.querySelector('#sms-panel').hidden = false;
    return;
  }
  document.cookie = 'DP_Token=auto%2Ftoken; Secure; Path=/';
  document.querySelector('#password').value = '';
  window.location.replace('/home');
}
document.querySelector('#login-form').addEventListener('submit', event => {
  event.preventDefault(); void submitLogin();
});
slider.addEventListener('change', () => { if (Number(slider.value) >= 100) void submitLogin(); });
</script>
